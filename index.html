<!DOCTYPE html>
<html lang="zh-TW">
  <script src="theme-init.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
  <title>錢錢手帳 App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div>
        <p class="sub-title">錢錢手帳 APP</p>
        <h1>記帳首頁</h1>
      </div>
      <button class="primary-btn" onclick="goToNew()">新增記帳</button>
    </header>

    <section class="summary-grid">
      <div class="card">
        <strong>本月收入</strong>
        <div id="income">NT$0</div>
      </div>
      <div class="card">
        <strong>本月支出</strong>
        <div id="expense">NT$0</div>
      </div>
      <div class="card">
        <strong>本月預算</strong>
        <div id="budget-text">NT$0</div>
      </div>
      <div class="card">
        <strong>餘額</strong>
        <div id="balance">NT$0</div>
      </div>
    </section>

    <section class="section-block">
      <div class="section-title">
        最近記錄
        <button class="secondary-btn" onclick="window.location.href='detail.html'">查看明細</button>
      </div>
      <ul id="recent-list" class="record-list"></ul>
      <p id="empty-msg" class="empty-msg">目前還沒有記帳，請先新增一筆。</p>
    </section>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="fa-solid fa-house"></i><span>首頁</span>
    </a>
    <a href="detail.html" class="nav-item">
      <i class="fa-solid fa-list"></i><span>明細</span>
    </a>
    <button class="add-btn" onclick="goToNew()">
      <i class="fa-solid fa-plus"></i>
    </button>
    <a href="stat.html" class="nav-item">
      <i class="fa-solid fa-chart-pie"></i><span>統計</span>
    </a>
    <a href="setting.html" class="nav-item">
      <i class="fa-solid fa-gear"></i><span>設定</span>
    </a>
  </nav>
  <p>趙凱樂製作©2026版權所有</p>
  <script src="script.js"></script>
</body>
</html>
