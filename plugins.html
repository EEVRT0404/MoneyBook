<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <script src="theme-init.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
  <title>錢錢手帳 App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div>
        <p class="sub-title">錢錢手帳 APP</p>
        <h1>擴充功能管理</h1>
      </div>
      <button class="secondary-btn" onclick="window.location.href='setting.html'">返回</button>
    </header>

    <section class="settings-panel">
      <div class="settings-card">
        <div class="settings-card-title">已安裝擴充功能</div>
        <p class="settings-item-desc">在此開啟或關閉擴充功能。</p>
        <ul class="settings-list" id="plugin-list"></ul>
      </div>
      <div class="settings-card">
        <div class="settings-card-title">擴充功能介紹</div>
        <div id="plugin-configs"></div>
      </div>
    </section>
  </div>
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="fa-solid fa-house"></i><span>首頁</span>
    </a>
    <a href="detail.html" class="nav-item">
      <i class="fa-solid fa-list"></i><span>明細</span>
    </a>
    <button class="add-btn" onclick="goToNew()">
      <i class="fa-solid fa-plus"></i>
    </button>
    <a href="stat.html" class="nav-item">
      <i class="fa-solid fa-chart-pie"></i><span>統計</span>
    </a>
    <a href="setting.html" class="nav-item">
      <i class="fa-solid fa-gear"></i><span>設定</span>
    </a>
  </nav>
  <script src="script.js"></script>
</body>
</html>
