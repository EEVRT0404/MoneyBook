<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <script src="theme-init.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
  <title>錢錢手帳 App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div>
        <p class="sub-title">錢錢手帳 APP</p>
        <h1>統計</h1>
      </div>
      <button class="secondary-btn" onclick="window.location.href='index.html'">返回</button>
    </header>

    <section class="summary-grid">
      <div class="card">
        <strong>總收入</strong>
        <div id="stat-income">NT$0</div>
      </div>
      <div class="card">
        <strong>總支出</strong>
        <div id="stat-expense">NT$0</div>
      </div>
      <div class="card">
        <strong>餘額</strong>
        <div id="stat-balance">NT$0</div>
      </div>
      <div class="card">
        <strong>記錄數</strong>
        <div id="record-count">0 筆</div>
      </div>
    </section>

    <section class="section-block">
      <div class="section-title">收入分類</div>
      <div id="income-bars" class="bar-chart"></div>
    </section>

    <section class="section-block">
      <div class="section-title">支出分類</div>
      <div id="expense-bars" class="bar-chart"></div>
    </section>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="fa-solid fa-house"></i><span>首頁</span>
    </a>
    <a href="detail.html" class="nav-item">
      <i class="fa-solid fa-list"></i><span>明細</span>
    </a>
    <button class="add-btn" onclick="goToNew()">
      <i class="fa-solid fa-plus"></i>
    </button>
    <a href="stat.html" class="nav-item">
      <i class="fa-solid fa-chart-pie"></i><span>統計</span>
    </a>
    <a href="setting.html" class="nav-item">
      <i class="fa-solid fa-gear"></i><span>設定</span>
    </a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
